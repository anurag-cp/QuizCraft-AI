<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive PDF Quiz</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f9f9f9; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .center { text-align: center; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem; }
        .score { font-weight: bold; font-size: 1.2rem; }
        .options-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
        .btn { padding: 1rem; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; font-size: 1rem; background: white; text-align: left; transition: 0.2s; }
        .btn:hover:not(:disabled) { background: #f0f0f0; }
        .btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .btn.selected { border-color: #0066cc; background: #e6f2ff; }
        .btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .primary { background: #0066cc; color: white; text-align: center; font-weight: bold; width: 100%; border: none; }
        .primary:hover:not(:disabled) { background: #0052a3; }
        #quiz-screen, #result-screen { display: none; }
        .feedback { text-align: center; font-size: 1.2rem; margin-bottom: 1rem; font-weight: bold; }
        .success-text { color: #28a745; }
        .error-text { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <!-- Upload Screen -->
    <div id="upload-screen" class="center">
        <h1>Interactive PDF Quiz</h1>
        <p>Upload a formatted PDF to begin</p>
        <input type="file" id="file-input" accept=".pdf">
        <p id="loading-text" style="display: none;">Processing PDF...</p>
        <p id="error-text" class="error-text"></p>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen">
        <div class="header">
            <h2 id="question-counter">Question 1</h2>
            <div class="score" id="score-display">Score: 0</div>
        </div>
        <h3 id="question-text"></h3>
        <div id="options-container" class="options-grid"></div>
        
        <div id="action-container">
            <button id="submit-btn" class="btn primary" disabled>Submit Answer</button>
        </div>
        <div id="feedback-container" style="display: none;">
            <p id="feedback-text" class="feedback"></p>
            <button id="next-btn" class="btn primary">Next Question</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="center">
        <h2>Quiz Completed! 🎉</h2>
        <h3 id="final-score"></h3>
        <button onclick="location.reload()" class="btn primary">Upload New PDF</button>
    </div>
</div>

<script>
    // State variables
    let quizData = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;

    // DOM Elements
    const uploadScreen = document.getElementById('upload-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const fileInput = document.getElementById('file-input');
    const loadingText = document.getElementById('loading-text');
    const errorText = document.getElementById('error-text');
    
    // Upload logic
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        loadingText.style.display = 'block';
        errorText.innerText = '';
        
        const formData = new FormData();
        formData.append('file', file);

        try {
            // NOTE: Change this URL to your live Render backend URL once deployed
            const response = await fetch('https://quiz-app-ioux.onrender.com/upload-pdf', {
    method: 'POST',
    body: formData
});
            
            if (!response.ok) throw new Error('Failed to parse PDF.');
            
            const data = await response.json();
            quizData = data.quiz_data;
            
            uploadScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            loadQuestion();
        } catch (err) {
            errorText.innerText = err.message;
        } finally {
            loadingText.style.display = 'none';
        }
    });

    function loadQuestion() {
        selectedOption = null;
        const currentQ = quizData[currentIndex];
        
        document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
        document.getElementById('score-display').innerText = `Score: ${score}`;
        document.getElementById('question-text').innerText = currentQ.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQ.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('action-container').style.display = 'block';
        document.getElementById('feedback-container').style.display = 'none';
        document.getElementById('submit-btn').disabled = true;
    }

    function selectOption(btnElement, option) {
        selectedOption = option;
        // Reset selection visual
        Array.from(document.getElementById('options-container').children).forEach(btn => {
            btn.classList.remove('selected');
        });
        btnElement.classList.add('selected');
        document.getElementById('submit-btn').disabled = false;
    }

    document.getElementById('submit-btn').onclick = () => {
        const currentQ = quizData[currentIndex];
        const buttons = Array.from(document.getElementById('options-container').children);
        
        // Disable all buttons
        buttons.forEach(btn => btn.disabled = true);
        
        const feedbackText = document.getElementById('feedback-text');
        
        if (selectedOption === currentQ.correct_answer) {
            score++;
            document.getElementById('score-display').innerText = `Score: ${score}`;
            feedbackText.innerHTML = '<span class="success-text">✅ Correct!</span>';
            buttons.find(b => b.innerText === selectedOption).classList.add('correct');
        } else {
            feedbackText.innerHTML = `<span class="error-text">❌ Incorrect. The answer is: <strong>${currentQ.correct_answer}</strong></span>`;
            buttons.find(b => b.innerText === selectedOption).classList.add('wrong');
            buttons.find(b => b.innerText === currentQ.correct_answer).classList.add('correct');
        }

        document.getElementById('action-container').style.display = 'none';
        document.getElementById('feedback-container').style.display = 'block';
        
        if (currentIndex === quizData.length - 1) {
            document.getElementById('next-btn').innerText = 'Finish Quiz';
        }
    };

    document.getElementById('next-btn').onclick = () => {
        currentIndex++;
        if (currentIndex >= quizData.length) {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            document.getElementById('final-score').innerText = `Your Score: ${score} / ${quizData.length}`;
        } else {
            loadQuestion();
        }
    };
</script>
</body>
</html>
